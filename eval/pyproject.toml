[project]
name = "denoise-eval"
version = "0.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "torch>=2.8",
  "torchvision>=0.23",
  "numpy>=2.0",
  "onnx>=1.18",
  "onnxruntime>=1.22",
  "onnxconverter-common>=1.15",
  "pillow>=11",
  "opencv-python-headless>=4.10",
  "scikit-image>=0.25",
  "bm3d>=4.0",
  "lpips>=0.1.4",
  "gdown>=5.2",
  "einops>=0.8",
  "timm>=1.0",
  "thop>=0.1",
  "rawpy>=0.24",
  "lmdb>=1.6",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 120
extend-exclude = ["data"]
